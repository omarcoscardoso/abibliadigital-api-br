steps:
  # 1. Build da imagem Docker utilizando a tag do commit e a tag latest para cache
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull gcr.io/${PROJECT_ID}/${_IMAGE_NAME}:latest || true
        docker build \
          -t gcr.io/${PROJECT_ID}/${_IMAGE_NAME}:${COMMIT_SHA} \
          -t gcr.io/${PROJECT_ID}/${_IMAGE_NAME}:latest \
          --cache-from gcr.io/${PROJECT_ID}/${_IMAGE_NAME}:latest \
          .

  # 2. Push da imagem com a tag do SHA do commit
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/${PROJECT_ID}/${_IMAGE_NAME}:${COMMIT_SHA}'

  # 3. Push da imagem com a tag latest
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/${PROJECT_ID}/${_IMAGE_NAME}:latest'

  # 4. Deploy no Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'gcr.io/${PROJECT_ID}/${_IMAGE_NAME}:${COMMIT_SHA}'
      - '--region'
      - '${_LOCATION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

# Imagens geradas pelo pipeline para rastreabilidade no Cloud Build
images:
  - 'gcr.io/${PROJECT_ID}/${_IMAGE_NAME}:${COMMIT_SHA}'
  - 'gcr.io/${PROJECT_ID}/${_IMAGE_NAME}:latest'

# Variáveis padrão substituíveis no Cloud Build Trigger
substitutions:
  _LOCATION: 'us-central1'
  _IMAGE_NAME: 'abibliadigital-api-br'
  _SERVICE_NAME: 'abibliadigital-api-br'

options:
  logging: CLOUD_LOGGING_ONLY
